steps:
  # Install the pinned ARM toolchain (make/tools.mk owns the version) and build
  # the firmware for the LEVTEK board. The toolchain is installed via
  # `make arm_sdk_install` rather than apt so CI uses the exact same compiler
  # version as developer machines.
  #
  # Both xz-utils and bzip2 are installed because the toolchain archive format
  # differs per branch: master pins 14.3.rel1 (.tar.xz), release_7_00 pins
  # gcc-arm-none-eabi 7-2018-q2 (.tar.bz2). Keeping both means one file works
  # unchanged on either branch.
  - name: 'ubuntu:22.04'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update -qq
        apt-get install -y --no-install-recommends ca-certificates make git wget xz-utils bzip2 python3
        make arm_sdk_install
        for board in ${_BOARDS}; do
          make fw_$$board
        done

  # Fetch the VESC Tool CLI from Artifact Registry. Same pattern as
  # levkart-esc-software, which already runs it in Cloud Build for conf generation.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        mkdir -p /workspace/tools-bin
        gcloud artifacts generic download \
          --project=$PROJECT_ID \
          --location=${_LOCATION} \
          --repository=levtek-binary \
          --package=vesc_tool \
          --version=${_VESC_TOOL_VERSION} \
          --destination=/workspace/tools-bin
        chmod +x /workspace/tools-bin/vesc_tool_${_VESC_TOOL_VERSION}

  # Pack each image for OTA. levkart-ota stages firmware in the bootloader's
  # new-app area, which is 393216 bytes, while objcopy emits 524280 (the linker
  # keeps .crcinfo at a fixed high address). Anything over the threshold has to be
  # heatshrink-compressed and given a size + CRC16 header. See levtek/README.md.
  #
  # VESC Tool is the reference implementation of that format, so use it directly
  # rather than a reimplementation that could drift from it.
  #
  # Written under build/ (already gitignored) so no new ignore rules are needed at
  # the repo root. Each artifact keeps the basename <board>.bin; only the file's
  # contents change, and VESC Tool loads a packed image transparently.
  - name: 'ubuntu:22.04'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update -qq
        # vesc_tool's NEEDED list (Qt itself is statically linked into it).
        # Taken from levkart-esc-software's cloudbuild, where it is already proven.
        apt-get install -y --no-install-recommends ca-certificates \
          libsdl2-2.0-0 libsm6 libice6 libxcb1 libxcb-icccm4 libxcb-image0 libxcb-shm0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-sync1 libxcb-xfixes0 libxcb-render0 libxcb-shape0 \
          libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon0 libegl1 libgles2 libdbus-1-3 libudev1
        # Surface any shared libraries vesc_tool still misses before we invoke it.
        ldd /workspace/tools-bin/vesc_tool_${_VESC_TOOL_VERSION} | grep 'not found' || true
        export QT_QPA_PLATFORM=offscreen
        mkdir -p build/packed
        for board in ${_BOARDS}; do
          /workspace/tools-bin/vesc_tool_${_VESC_TOOL_VERSION} --packFirmware \
            build/$$board/$$board.bin:build/packed/$$board.bin
          test -s build/packed/$$board.bin
        done

  # Independently verify what vesc_tool produced: unpack each image with our own
  # implementation and require the result to match the image we just built.
  #
  # This is the check that makes using an opaque prebuilt binary safe. If the two
  # implementations ever disagree -- a vesc_tool upgrade changing the format, a
  # truncated download, a codec-parameter change -- the build fails here instead of
  # shipping an image the bootloader cannot decompress. It also keeps
  # pack_firmware_ota.py honest, which matters because --unpack is how a bricked
  # board's raw image is recovered for SWD flashing.
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Installing the package rather than heatshrink2 directly keeps the
        # version pin in levtek/pyproject.toml as the single source of truth.
        pip install --quiet --no-cache-dir ./levtek
        for board in ${_BOARDS}; do
          python3 levtek/pack_firmware_ota.py --unpack \
            build/packed/$$board.bin \
            build/packed/$$board-roundtrip.bin
          cmp build/$$board/$$board.bin build/packed/$$board-roundtrip.bin
          rm -f build/packed/$$board-roundtrip.bin
          echo "verified: $$board packed image unpacks byte-identical to the build output"
        done

  # Upload build/packed/<board>.bin for each board to Artifact Registry.
  # Branch builds go to levtek-binary; tag builds go to levtek-binary-release.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [ -n "$TAG_NAME" ]; then
          REPO=levtek-binary-release
          VERSION=$TAG_NAME
        else
          REPO=levtek-binary
          SHA=$COMMIT_SHA
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/_' '--')
          VERSION=$${SAFE_BRANCH}-$${SHA:0:11}
        fi
        for board in ${_BOARDS}; do
          gcloud artifacts generic upload \
            --project=$PROJECT_ID \
            --location=${_LOCATION} \
            --repository=$$REPO \
            --package=${_PACKAGE} \
            --version=$$VERSION \
            --source=build/packed/$$board.bin
        done

serviceAccount: 'projects/levtek-infrastructure/serviceAccounts/cloudbuild-ci@levtek-infrastructure.iam.gserviceaccount.com'

substitutions:
  _LOCATION: europe-west4
  _BOARDS: levtek_1_0_3 levtek_1_0_4
  _PACKAGE: levkart-esc-firmware
  # The packing format is fixed by the bootloader on the boards, not by whatever
  # is newest upstream, so this is pinned deliberately. Bumping it needs the
  # verification step above to still pass, and ideally a hand-flash check.
  _VESC_TOOL_VERSION: '7.00'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
